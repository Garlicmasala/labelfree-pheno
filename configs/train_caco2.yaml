# Full real-data run — GPU (base64 / depth4 / 256 crop / 60 epochs / all 178 train fields)
# Run inside a Kaggle GPU notebook (see notebooks/kaggle_train.py).
seed: 42
out: runs/caco2
data:
  synthetic: false
  pairs_csv: data/caco2/pairs.csv
  root: data/caco2/raw
  crop: 256
  limit: 0
  in_ch: 1
  out_ch: 2
model:
  base: 64
  depth: 4
  attn: true
  dropout: 0.1
train:
  epochs: 60
  batch: 16
  lr: 0.0004
  wd: 0.0001
  w_fourier: 0.5
  w_perceptual: 0.05
